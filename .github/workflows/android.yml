name: Build Aura Vale Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build game
        run: |
          npm install
          npm test
          npm run build
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory dist > /tmp/aura-vale-preview.log 2>&1 &
          server_pid=$!
          python3 -m http.server 8766 --directory . > /tmp/aura-vale-source.log 2>&1 &
          source_pid=$!
          trap 'kill "$server_pid" "$source_pid"' EXIT
          node tests/browser.cjs
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 configure-android.py
      - uses: actions/cache@v4
        with:
          path: android/aura-vale-debug.keystore
          key: aura-vale-debug-signing-v1
      - name: Create test signing key if needed
        run: |
          if [ ! -f android/aura-vale-debug.keystore ]; then
            keytool -genkeypair -keystore android/aura-vale-debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Aura Vale Debug" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-vale-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            aura-vale-desktop.png
            aura-vale-phone.png
            aura-vale-collection.png
          if-no-files-found: error
          retention-days: 30
